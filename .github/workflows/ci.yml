name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types
        run: bun run typecheck
      - name: Run tests
        run: bun test
      - name: Build package
        run: bun run check:build
      - name: Check package contents
        run: npm pack --dry-run

  current-opencode-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install current OpenCode beta
        run: |
          bun install --frozen-lockfile
          bun update @opencode-ai/plugin@beta
      - name: Check current OpenCode beta
        run: |
          bun run typecheck
          bun test
          bun run check:build
